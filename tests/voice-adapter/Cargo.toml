[package]
name = "meetingbox-voice-adapter-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Run protocol tests without building Tauri, Whisper or platform audio libraries.
[workspace]

[dependencies]
async-trait = "0.1"
log = "0.4"
once_cell = "1"
reqwest = { version = "=0.11.27", default-features = false, features = ["multipart", "json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "=2.5.0"
encoding_rs = "=0.8.35"

[profile.dev]
debug = 0
incremental = false
