[package]
name = "meetingbox-transcript-correction-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Exercise production modules without Tauri, Whisper or audio dependencies.
[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "=2.5.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.dev]
debug = 0
incremental = false
